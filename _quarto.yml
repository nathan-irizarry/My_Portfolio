project:
  type: website
  output-dir: _site

website:
  title: "Nathan Irizarry | Product Portfolio"
  favicon: images/prototyping-favicon.png
  navbar:
    background: dark
    right:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - text: Projects
        menu:
          - href: projects/project-1.qmd
            text: ExperienceLink
          - href: projects/project-2.qmd
            text: FestaCatering
          - href: projects/project-3.qmd
            text: Market Entry Strategy

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    include-after-body:
      - text: |
          <script>
          // Theme Toggle Functionality
          (function() {
            const THEME_KEY = 'portfolio-theme';

            function getStoredTheme() {
              return localStorage.getItem(THEME_KEY);
            }

            function setTheme(theme) {
              document.documentElement.setAttribute('data-theme', theme);
              localStorage.setItem(THEME_KEY, theme);
              updateToggleButton(theme);
            }

            function updateToggleButton(theme) {
              const btn = document.getElementById('theme-toggle');
              if (btn) {
                const icon = btn.querySelector('i');
                if (icon) {
                  icon.className = theme === 'light' ? 'fas fa-moon' : 'fas fa-sun';
                }
              }
            }

            function initTheme() {
              const stored = getStoredTheme();
              if (stored) {
                setTheme(stored);
              } else {
                setTheme('light');
              }
            }

            // Initialize on load
            initTheme();

            // Create and inject theme toggle button
            document.addEventListener('DOMContentLoaded', function() {
              const navbar = document.querySelector('.navbar-nav');
              if (navbar) {
                const toggleLi = document.createElement('li');
                toggleLi.className = 'nav-item';
                toggleLi.innerHTML = '<button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>';
                navbar.appendChild(toggleLi);

                const currentTheme = getStoredTheme() || 'light';
                updateToggleButton(currentTheme);

                document.getElementById('theme-toggle').addEventListener('click', function() {
                  const current = document.documentElement.getAttribute('data-theme') || 'light';
                  setTheme(current === 'light' ? 'dark' : 'light');
                });
              }

              // Scroll Animations with IntersectionObserver
              const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
              };

              const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                  if (entry.isIntersecting) {
                    entry.target.classList.add('animate-in');
                    observer.unobserve(entry.target);
                  }
                });
              }, observerOptions);

              // Observe elements with animation classes
              document.querySelectorAll('.animate-on-scroll').forEach(el => {
                observer.observe(el);
              });

              // Staggered animations for grid items
              document.querySelectorAll('.bento-grid .project-card, .timeline-item, .skill-tag').forEach((el, index) => {
                el.style.transitionDelay = (index * 0.1) + 's';
                observer.observe(el);
              });

              // Filter buttons functionality
              const filterBtns = document.querySelectorAll('.filter-btn');
              const projectCards = document.querySelectorAll('.project-card');

              filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                  filterBtns.forEach(b => b.classList.remove('active'));
                  btn.classList.add('active');

                  const filter = btn.getAttribute('data-filter');

                  projectCards.forEach(card => {
                    if (filter === 'all' || card.getAttribute('data-category')?.includes(filter)) {
                      card.style.display = '';
                      card.classList.add('animate-in');
                    } else {
                      card.style.display = 'none';
                    }
                  });
                });
              });
            });
          })();
          </script>
